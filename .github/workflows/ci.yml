name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Restrict permissions to the minimum needed.
permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

      - name: Audit dependencies
        # Fail the build on any high-severity vulnerability.
        run: npm audit --audit-level=high
